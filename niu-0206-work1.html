<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的示例网页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background-color: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            padding: 40px 50px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            text-align: center;
        }
        h1 {
            font-size: 36px;
            margin-bottom: 16px;
        }
        p {
            font-size: 18px;
            margin-bottom: 24px;
            opacity: 0.9;
        }
        button {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background: #fff;
            color: #667eea;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 15px rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>欢迎来到示例网页</h1>
        <p>这是一个随机生成的简约网页页面</p>
        <button onclick="showMsg()">点击我</button>
    </div>

    <script>
        function showMsg() {
            alert("你点击了按钮！🎉");
        }
    </script>
</body>
</html>
